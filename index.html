<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X O Game</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  text-align: center;
}

h1 {
  margin-top: 25px;
  font-size: 28px;
  color: #38bdf8;
}

#status {
  margin-top: 10px;
  font-size: 18px;
  color: #facc15;
}

.board {
  display: grid;
  grid-template-columns: repeat(3, 90px);
  gap: 10px;
  justify-content: center;
  margin-top: 30px;
}

.cell {
  width: 90px;
  height: 90px;
  background: rgba(255,255,255,0.08);
  border-radius: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 38px;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 0 10px rgba(0,0,0,0.4);
}

.cell:hover {
  transform: scale(1.1);
  background: rgba(255,255,255,0.15);
}

button {
  margin-top: 25px;
  padding: 10px 25px;
  border: none;
  border-radius: 10px;
  background: #38bdf8;
  color: black;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #0ea5e9;
  transform: scale(1.05);
}

.win {
  color: #22c55e;
  font-size: 22px;
  animation: pop 0.4s ease-in-out;
}

@keyframes pop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
</style>
</head>

<body>

<h1>🎮 X O GAME</h1>
<h2 id="status">Player X баштайт</h2>

<div class="board" id="board"></div>

<button onclick="resetGame()">🔄 Кайра баштоо</button>

<script>
let currentPlayer = "X";
let cells = Array(9).fill("");
let gameOver = false;

const board = document.getElementById("board");
const status = document.getElementById("status");

function createBoard() {
  board.innerHTML = "";
  cells.forEach((val, i) => {
    const div = document.createElement("div");
    div.classList.add("cell");
    div.innerText = val;
    div.addEventListener("click", () => makeMove(i));
    board.appendChild(div);
  });
}

function makeMove(i) {
  if (cells[i] !== "" || gameOver) return;

  cells[i] = currentPlayer;

  if (checkWin()) {
    status.innerHTML = "🎉 <span class='win'>Player " + currentPlayer + " утту!</span>";
    gameOver = true;
    createBoard();
    return;
  }

  if (!cells.includes("")) {
    status.innerText = "🤝 Ничья!";
    gameOver = true;
    createBoard();
    return;
  }

  currentPlayer = currentPlayer === "X" ? "O" : "X";
  status.innerText = "Player " + currentPlayer + " кезеги";

  createBoard();
}

function checkWin() {
  const winPatterns = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  return winPatterns.some(p =>
    cells[p[0]] &&
    cells[p[0]] === cells[p[1]] &&
    cells[p[1]] === cells[p[2]]
  );
}

function resetGame() {
  cells = Array(9).fill("");
  currentPlayer = "X";
  gameOver = false;
  status.innerText = "Player X баштайт";
  createBoard();
}

createBoard();
</script>

</body>
</html>
